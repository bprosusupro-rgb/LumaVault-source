name: Attach LumaVault 0.2 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and attach the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=LumaVault-0.2-release.apk
          gh api "repos/$GITHUB_REPOSITORY/contents/artifacts/$apk?ref=$GITHUB_SHA" --jq .content |
            base64 --decode > "$apk"
          echo "61ac7acc545c641648ad74648fdf6bfcd5487be59318b4219004791c800b79d6  $apk" | sha256sum --check
          gh release upload v0.2 "$apk" --repo "$GITHUB_REPOSITORY"
          gh release view v0.2 --repo "$GITHUB_REPOSITORY" --json assets
